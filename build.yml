name: Compilar instaladores
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmds: npm run dist:mac
            name: mac
          - os: ubuntu-latest
            cmds: npm run dist:linux
            name: linux
          - os: windows-latest
            cmds: npm run dist:win-user && npm run dist:win-system
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: ${{ matrix.cmds }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          path: |
            dist/*.pkg
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
